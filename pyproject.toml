[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "war3-retro-hd-converter"
version = "0.1.0"
description = "Convert Warcraft III Reforged SD MDX models to HD-material MDX models with generated RetroTex PBR textures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "War3 Retro HD Converter contributors" }]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "python-dateutil>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
war3-retro-hd = "war3_retro_hd.cli:main"

[project.gui-scripts]
war3-retro-hd-desktop = "war3_retro_hd.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
